<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold text-center text-gray-700">Connexion</h2>
        <form action="/login" method="POST" class="mt-4">
            <div>
                <label class="block text-sm">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <div class="mt-4">
                <label class="block text-sm">Mot de passe</label>
                <input type="password" name="password" required class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <button type="submit" class="w-full px-4 py-2 mt-4 font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Se connecter</button>
        </form>
        <p class="mt-4 text-center text-sm">Pas encore de compte ? <a href="/register" class="text-indigo-600 hover:underline">S'inscrire</a></p>
    </div>
</body>
</html>
