<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracted Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-3xl">
            <h1 class="text-3xl font-semibold text-center text-green-600 mb-6">Extracted Text</h1>
            
            <div class="mb-4">
                <table class="w-full border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 text-center">
                                <input type="checkbox" id="selectAll">
                            </th>
                            <th class="p-2 text-left">Texte</th>
                            <th class="p-2 text-left">Note</th>
                            <th class="p-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Les lignes seront insérées ici par JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="flex justify-between mt-4">
                <button id="deleteSelected" class="bg-red-500 text-white px-4 py-2 rounded-md shadow-md hover:bg-red-600 transition duration-300">
                    Supprimer sélectionnés
                </button>
                <a href="/" class="bg-blue-500 text-white px-4 py-2 rounded-md shadow-md hover:bg-blue-600 transition duration-300">
                    Télécharger une autre image
                </a>
            </div>
        </div>
    </div>

    <script>
        let extracted_text = `{{ extracted_text }}`;

        let tableBody = document.getElementById("tableBody");
        let selectAllCheckbox = document.getElementById("selectAll");
        let deleteSelectedButton = document.getElementById("deleteSelected");

        if (extracted_text) {
            extracted_text.split("\n").forEach(line => {
                line = line.trim();
                if (line) {
                    let row = document.createElement("tr");
                    row.classList.add("border-b", "border-gray-300");

                    // Colonne checkbox
                    let checkboxCell = document.createElement("td");
                    checkboxCell.classList.add("p-2", "text-center", "border");
                    let checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.classList.add("rowCheckbox");
                    checkboxCell.appendChild(checkbox);
                    row.appendChild(checkboxCell);

                    // Traitement du texte pour extraire le texte suivant `>`
                    let textBefore = line;
                    let note = '';
                    if (line.includes('»')) {
                        [textBefore, note] = line.split('»').map(text => text.trim());
                    }

                    // Colonne du texte éditable
                    let textCell = document.createElement("td");
                    textCell.classList.add("p-2", "text-gray-800", "text-lg", "cursor-pointer", "border");
                    textCell.textContent = textBefore;
                    textCell.setAttribute("contenteditable", "true");
                    row.appendChild(textCell);

                    // Colonne "Note" éditable
                    let noteCell = document.createElement("td");
                    noteCell.classList.add("p-2", "text-gray-800", "text-lg", "border");
                    noteCell.textContent = note;
                    noteCell.setAttribute("contenteditable", "true"); // Rendre cette cellule éditable
                    row.appendChild(noteCell);

                    // Colonne du bouton de suppression
                    let deleteCell = document.createElement("td");
                    deleteCell.classList.add("p-2", "text-center", "border");
                    let deleteButton = document.createElement("button");
                    deleteButton.classList.add("bg-red-500", "text-white", "px-3", "py-1", "rounded-md", "hover:bg-red-600", "transition", "duration-300");
                    deleteButton.textContent = "Supprimer";
                    
                    // Supprimer la ligne au clic
                    deleteButton.onclick = function() {
                        tableBody.removeChild(row);
                    };

                    deleteCell.appendChild(deleteButton);
                    row.appendChild(deleteCell);

                    tableBody.appendChild(row);
                }
            });
        }

        // Sélectionner/Désélectionner toutes les lignes
        selectAllCheckbox.addEventListener("change", function() {
            document.querySelectorAll(".rowCheckbox").forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
        });

        // Supprimer les lignes sélectionnées
        deleteSelectedButton.addEventListener("click", function() {
            document.querySelectorAll(".rowCheckbox:checked").forEach(checkbox => {
                tableBody.removeChild(checkbox.closest("tr"));
            });
            selectAllCheckbox.checked = false;
        });

    </script>

</body>
</html>
